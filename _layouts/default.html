<!doctype html>
<html lang="{{ site.locale | slice: 0,2 | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include seo.html %}
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }} Feed" href="{{ '/feed.xml' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/theme.css' | relative_url }}">
    {% include analytics.html %}
    {% include head/custom.html %}
  </head>
  <body class="layout--{{ page.layout | default: layout.layout }}">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header" id="siteHeader">
      <div class="shell nav">
        <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav class="navlinks" aria-label="Primary navigation">
          {% for link in site.data.navigation.main %}
            <a href="{{ link.url | relative_url }}">{{ link.title }}</a>
          {% endfor %}
          <span class="theme-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        </nav>
      </div>
    </header>
    <main id="main">{{ content }}</main>
    <footer class="site-footer">
      <div class="shell footer-row">
        <span>{{ site.title }} — Threat Research</span>
        <span>&copy; <span id="footerYear">2026</span> {{ site.title }}</span>
      </div>
    </footer>
    <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
  </body>
</html>
