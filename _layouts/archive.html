---
layout: default
---

<section class="archive-hero">
  <div class="shell">
    <p class="eyebrow">Research Archive</p>
    <h1>{{ page.title }}</h1>
    <p>{{ site.posts | size }} reports documenting adversary operations, malware, infrastructure and tradecraft.</p>
  </div>
</section>
<section class="shell research-section">
  {{ content }}
  <div class="research-grid">
    {% for post in site.posts %}
      {% include post-card.html post=post reveal=true %}
    {% endfor %}
  </div>
</section>
