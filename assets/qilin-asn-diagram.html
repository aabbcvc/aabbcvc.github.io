<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qilin Affiliate — ASN Infrastructure</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #080c12;
    font-family: 'Courier New', monospace;
    color: #e2e8f0;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;

// ── ASN accent colours ───────────────────────────────────────────────────────
const ASN_COLOR = {
  "AS 395092": "#38bdf8",
  "AS 42624":  "#a78bfa",
  "AS 399486": "#34d399",
  "AS 149440": "#fb923c",
};

// ── Data ─────────────────────────────────────────────────────────────────────
const ASNs = [
  {
    id: "AS 395092",
    ips: [
      {
        ip: "144.208.127.61",
        date: "2025-10-29",
        context: "Open-directory archived by Hunt.io on 2025-10-29. Contained serverPOST.py — a Flask exfiltration handler for receiving stolen VPN configs. File overlap with 185.208.158.147 and 185.196.11.235."
      }
    ]
  },
  {
    id: "AS 42624",
    ips: [
      {
        ip: "185.208.158.147",
        date: "2025-08-28",
        context: "Earliest archived open-directory (Hunt.io, 2025-08-28). Contained serverPOST.py — a Flask exfiltration handler for receiving stolen VPN configs. File overlap with 144.208.127.61 and 185.196.11.235. Establishes the affiliate's activity back to at least August 2025."
      },
      {
        ip: "185.196.11.235",
        date: "2026-01-12",
        context: "Open-directory archived 2026-01-12. Contained significant file overlap with 194.59.30.9, the Qilin binary 'kruss', and serverPOST.py — a Flask exfiltration handler for receiving stolen VPN configs."
      }
    ]
  },
  {
    id: "AS 399486",
    ips: [
      {
        ip: "194.59.30.9",
        date: "2025-12-14",
        context: "Primary staging server identified 2025-12-14. Exposed Qilin binaries (qusar, tron, sssd), Sliver C2 client configs pointing to 31.57.147.229 and 31.57.38.155, WatchGuard PoC exploits, VPN configs, and a Python reverse shell calling back to 79.110.49.146."
      },
      {
        ip: "79.110.49.146",
        date: "2026-03-05",
        context: "First observed December 2025 as the reverse-shell callback IP embedded in events.py on 194.59.30.9. Three months later (2026-03-05) this same IP exposed its own open-directory, revealing new Sliver configs for 23.27.140.108 and 23.27.143.170."
      },
      {
        ip: "31.57.147.229",
        date: null,
        context: "Sliver C2 server. Its client config file (client_31.57.147.229.cfg) was recovered from the 194.59.30.9 open-directory. The config could allow direct authentication to this Sliver C2 server."
      }
    ]
  },
  {
    id: "AS 149440",
    ips: [
      {
        ip: "23.27.140.108",
        date: null,
        context: "Sliver C2 server. Config recovered from the 79.110.49.146 open-directory (March 2026). Also referenced in the January 2026 open-directory, indicating sustained use across multiple campaigns."
      },
      {
        ip: "31.57.38.155",
        date: null,
        context: "Sliver C2 server. Client config (vcenter_31.57.38.155.cfg) recovered from 194.59.30.9 — the 'vcenter' prefix suggests targeting of VMware vCenter environments."
      },
      {
        ip: "23.27.143.170",
        date: null,
        context: "Sliver C2 server. Config recovered from the 79.110.49.146 open-directory (March 2026)."
      }
    ]
  }
];

// ── Connections ───────────────────────────────────────────────────────────────
const CONNECTIONS = [
  { from: "194.59.30.9",    to: "31.57.147.229",  label: "Sliver cfg" },
  { from: "194.59.30.9",    to: "31.57.38.155",   label: "Sliver cfg" },
  { from: "79.110.49.146",  to: "23.27.140.108",  label: "Sliver cfg" },
  { from: "79.110.49.146",  to: "23.27.143.170",  label: "Sliver cfg" },
  { from: "194.59.30.9",    to: "79.110.49.146",  label: "rev-shell CB" },
  { from: "185.196.11.235", to: "194.59.30.9",    label: "file overlap" },
  { from: "144.208.127.61", to: "185.208.158.147", label: "serverPOST.py" },
  { from: "185.208.158.147","to": "185.196.11.235", label: "serverPOST.py" },
  { from: "144.208.127.61", to: "185.196.11.235",  label: "serverPOST.py" },
];

// ── Canvas layout ─────────────────────────────────────────────────────────────
const W = 1100, H = 680;
const NODE_R = 36;

const ASN_BOXES = {
  "AS 395092": { x: 60,  y: 60,  w: 220, h: 150 },
  "AS 42624":  { x: 370, y: 60,  w: 310, h: 220 },
  "AS 399486": { x: 60,  y: 290, w: 470, h: 320 },
  "AS 149440": { x: 610, y: 290, w: 440, h: 320 },
};

const IP_POS = {
  "144.208.127.61":  { x: 175, y: 140 },
  "185.208.158.147": { x: 460, y: 138 },
  "185.196.11.235":  { x: 570, y: 228 },
  "194.59.30.9":     { x: 180, y: 390 },
  "79.110.49.146":   { x: 310, y: 500 },
  "31.57.147.229":   { x: 430, y: 440 },
  "23.27.140.108":   { x: 700, y: 385 },
  "31.57.38.155":    { x: 870, y: 385 },
  "23.27.143.170":   { x: 785, y: 510 },
};

// ── Helpers ────────────────────────────────────────────────────────────────────
function curvePath(from, to) {
  const p1 = IP_POS[from], p2 = IP_POS[to];
  if (!p1 || !p2) return "";
  const dx = p2.x - p1.x, dy = p2.y - p1.y;
  const cx = (p1.x + p2.x) / 2 - dy * 0.22;
  const cy = (p1.y + p2.y) / 2 + dx * 0.22;
  return `M ${p1.x} ${p1.y} Q ${cx} ${cy} ${p2.x} ${p2.y}`;
}

function asnOfIP(ip) {
  return ASNs.find(a => a.ips.some(i => i.ip === ip))?.id;
}

// ── Tooltip ────────────────────────────────────────────────────────────────────
function Tooltip({ ip, onClose }) {
  if (!ip) return null;
  const allIPs = ASNs.flatMap(a => a.ips);
  const data   = allIPs.find(i => i.ip === ip);
  const asn    = ASNs.find(a => a.ips.some(i => i.ip === ip));
  if (!data) return null;
  const c = ASN_COLOR[asn.id];
  const outgoing = CONNECTIONS.filter(c => c.from === ip);
  const incoming = CONNECTIONS.filter(c => c.to   === ip);

  return (
    <div style={{
      position: "fixed", inset: 0,
      display: "flex", alignItems: "center", justifyContent: "center",
      background: "rgba(0,0,0,0.7)", zIndex: 100,
    }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{
        background: "#0d1724",
        border: `1px solid ${c}44`,
        borderTop: `2px solid ${c}`,
        borderRadius: 8,
        padding: "22px 26px",
        minWidth: 360,
        maxWidth: 480,
        boxShadow: `0 0 50px #0009, 0 0 20px ${c}18`,
      }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:14 }}>
          <div>
            <code style={{ fontSize:16, color:"#e2e8f0", letterSpacing:"0.05em", display:"block", marginBottom:4 }}>{data.ip}</code>
            <span style={{
              fontSize:10, color:c, background: c+"18",
              border:`1px solid ${c}44`, borderRadius:3,
              padding:"1px 7px", fontFamily:"monospace", letterSpacing:"0.06em"
            }}>{asn.id}</span>
          </div>
          <button onClick={onClose} style={{
            background:"none", border:"none", color:"#475569",
            cursor:"pointer", fontSize:18, lineHeight:1, padding:"0 0 0 16px"
          }}>✕</button>
        </div>

        {data.date && (
          <div style={{ fontSize:11, color:"#475569", marginBottom:12, fontFamily:"monospace" }}>
            First observed: <span style={{ color:"#64748b" }}>{data.date}</span>
          </div>
        )}

        <p style={{ fontSize:12, color:"#94a3b8", lineHeight:1.65, marginBottom: (outgoing.length||incoming.length) ? 16 : 0 }}>
          {data.context}
        </p>

        {outgoing.length > 0 && (
          <div style={{ marginTop:14 }}>
            <div style={{ fontSize:9, color:"#334155", marginBottom:6, textTransform:"uppercase", letterSpacing:"0.1em" }}>References →</div>
            {outgoing.map(conn => (
              <div key={conn.to} style={{ fontSize:11, marginBottom:4, display:"flex", gap:8, alignItems:"center" }}>
                <span style={{ color:"#334155", fontSize:9 }}>[{conn.label}]</span>
                <code style={{ color: ASN_COLOR[asnOfIP(conn.to)] || "#94a3b8" }}>{conn.to}</code>
              </div>
            ))}
          </div>
        )}
        {incoming.length > 0 && (
          <div style={{ marginTop:14 }}>
            <div style={{ fontSize:9, color:"#334155", marginBottom:6, textTransform:"uppercase", letterSpacing:"0.1em" }}>Referenced by ←</div>
            {incoming.map(conn => (
              <div key={conn.from} style={{ fontSize:11, marginBottom:4, display:"flex", gap:8, alignItems:"center" }}>
                <span style={{ color:"#334155", fontSize:9 }}>[{conn.label}]</span>
                <code style={{ color: ASN_COLOR[asnOfIP(conn.from)] || "#94a3b8" }}>{conn.from}</code>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ── App ────────────────────────────────────────────────────────────────────────
function App() {
  const [activeIP,   setActiveIP]   = useState(null);
  const [hoverIP,    setHoverIP]    = useState(null);
  const [transform,  setTransform]  = useState({ x: 0, y: 0, scale: 1 });
  const dragging = useRef(false);
  const lastPos  = useRef({ x: 0, y: 0 });
  const svgRef   = useRef(null);
  const pinch    = useRef(null); // { dist, cx, cy } for two-finger zoom

  // Centre on mount
  useEffect(() => {
    setTransform({
      x: (window.innerWidth  - W) / 2,
      y: (window.innerHeight - H) / 2,
      scale: 1,
    });
  }, []);

  const onWheel = useCallback(e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 0.91;
    const rect   = svgRef.current.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    setTransform(t => {
      const newScale = Math.min(Math.max(t.scale * factor, 0.25), 6);
      const ratio    = newScale / t.scale;
      return { scale: newScale, x: mx - ratio * (mx - t.x), y: my - ratio * (my - t.y) };
    });
  }, []);

  const onMouseDown = useCallback(e => {
    if (e.button !== 0) return;
    dragging.current = true;
    lastPos.current  = { x: e.clientX, y: e.clientY };
  }, []);

  const onMouseMove = useCallback(e => {
    if (!dragging.current) return;
    const dx = e.clientX - lastPos.current.x;
    const dy = e.clientY - lastPos.current.y;
    lastPos.current = { x: e.clientX, y: e.clientY };
    setTransform(t => ({ ...t, x: t.x + dx, y: t.y + dy }));
  }, []);

  const onMouseUp   = useCallback(() => { dragging.current = false; }, []);

  // ── Touch handlers (mobile pan + pinch-zoom) ─────────────────────────────
  const onTouchStart = useCallback(e => {
    if (e.touches.length === 1) {
      dragging.current = true;
      lastPos.current  = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      pinch.current    = null;
    } else if (e.touches.length === 2) {
      dragging.current = false;
      const [a, b] = e.touches;
      const dx = b.clientX - a.clientX, dy = b.clientY - a.clientY;
      pinch.current = {
        dist: Math.hypot(dx, dy),
        cx: (a.clientX + b.clientX) / 2,
        cy: (a.clientY + b.clientY) / 2,
      };
    }
  }, []);

  const onTouchMove = useCallback(e => {
    if (e.touches.length === 1 && dragging.current) {
      e.preventDefault();
      const t  = e.touches[0];
      const dx = t.clientX - lastPos.current.x;
      const dy = t.clientY - lastPos.current.y;
      lastPos.current = { x: t.clientX, y: t.clientY };
      setTransform(tr => ({ ...tr, x: tr.x + dx, y: tr.y + dy }));
    } else if (e.touches.length === 2 && pinch.current) {
      e.preventDefault();
      const [a, b] = e.touches;
      const dx = b.clientX - a.clientX, dy = b.clientY - a.clientY;
      const newDist = Math.hypot(dx, dy);
      const cx = (a.clientX + b.clientX) / 2;
      const cy = (a.clientY + b.clientY) / 2;
      const factor = newDist / pinch.current.dist;
      const rect   = svgRef.current.getBoundingClientRect();
      const mx = cx - rect.left, my = cy - rect.top;
      setTransform(tr => {
        const newScale = Math.min(Math.max(tr.scale * factor, 0.25), 6);
        const ratio    = newScale / tr.scale;
        return {
          scale: newScale,
          x: mx - ratio * (mx - tr.x) + (cx - pinch.current.cx),
          y: my - ratio * (my - tr.y) + (cy - pinch.current.cy),
        };
      });
      pinch.current = { dist: newDist, cx, cy };
    }
  }, []);

  const onTouchEnd = useCallback(e => {
    if (e.touches.length === 0) {
      dragging.current = false;
      pinch.current    = null;
    } else if (e.touches.length === 1) {
      // Pinch ended but one finger remains — resume panning from it
      pinch.current   = null;
      dragging.current = true;
      lastPos.current  = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
  }, []);

  const connectedToHover = new Set(
    CONNECTIONS
      .filter(c => c.from === hoverIP || c.to === hoverIP)
      .flatMap(c => [c.from, c.to])
  );

  const { x, y, scale } = transform;

  return (
    <div style={{ width:"100vw", height:"100vh", overflow:"hidden", background:"#080c12", position:"relative" }}>
      <svg
        ref={svgRef}
        width="100%" height="100%"
        style={{ display:"block", cursor: dragging.current ? "grabbing" : "grab", userSelect:"none", touchAction:"none" }}
        onMouseDown={onMouseDown}
        onMouseMove={onMouseMove}
        onMouseUp={onMouseUp}
        onMouseLeave={onMouseUp}
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
        onTouchCancel={onTouchEnd}
      >
        <defs>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"
            patternTransform={`translate(${x % 40},${y % 40}) scale(${scale})`}>
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0b1829" strokeWidth={0.5 / scale}/>
          </pattern>
          <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
            <polygon points="0 0, 7 3.5, 0 7" fill="#2d4a6b"/>
          </marker>
          <marker id="arr-hi" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
            <polygon points="0 0, 7 3.5, 0 7" fill="#64748b"/>
          </marker>
        </defs>

        {/* Infinite grid background */}
        <rect width="100%" height="100%" fill="url(#grid)"/>

        {/* Zoomable / pannable content */}
        <g transform={`translate(${x},${y}) scale(${scale})`}>

          {/* ASN boxes */}
          {ASNs.map(asn => {
            const b = ASN_BOXES[asn.id];
            const c = ASN_COLOR[asn.id];
            return (
              <g key={asn.id}>
                <rect x={b.x} y={b.y} width={b.w} height={b.h}
                  rx={7} fill={c + "09"} stroke={c + "30"} strokeWidth="1.5"/>
                <rect x={b.x + 12} y={b.y - 11} width={84} height={22} rx={4}
                  fill={c + "25"} stroke={c + "55"} strokeWidth="1"/>
                <text x={b.x + 54} y={b.y + 6}
                  textAnchor="middle" fontSize="10.5"
                  fontFamily="'Courier New', monospace" fontWeight="700"
                  fill={c} letterSpacing="0.05em"
                >{asn.id}</text>
                <text x={b.x + b.w - 10} y={b.y + 18}
                  textAnchor="end" fontSize="9"
                  fontFamily="'Courier New', monospace" fill={c + "55"}
                >{asn.ips.length} IP{asn.ips.length > 1 ? "s" : ""}</text>
              </g>
            );
          })}

          {/* Connection lines */}
          {CONNECTIONS.map((conn, i) => {
            const p    = curvePath(conn.from, conn.to);
            const isHi = hoverIP && (conn.from === hoverIP || conn.to === hoverIP);
            const fade = hoverIP && !isHi;
            const p1   = IP_POS[conn.from], p2 = IP_POS[conn.to];
            let lx = 0, ly = 0;
            if (p1 && p2) {
              const dx = p2.x - p1.x, dy = p2.y - p1.y;
              lx = (p1.x + p2.x) / 2 - dy * 0.22 + dx * 0.12;
              ly = (p1.y + p2.y) / 2 + dx * 0.22 + dy * 0.12;
            }
            return (
              <g key={i} style={{ transition:"opacity 0.15s" }} opacity={fade ? 0.06 : 1}>
                <path d={p} fill="none"
                  stroke={isHi ? "#64748b" : "#1a3050"}
                  strokeWidth={isHi ? 1.5 : 1}
                  strokeDasharray="5 4"
                  markerEnd={isHi ? "url(#arr-hi)" : "url(#arr)"}
                />
                {isHi && (
                  <text x={lx} y={ly} textAnchor="middle" fontSize="8"
                    fontFamily="'Courier New', monospace" fill="#475569"
                  >{conn.label}</text>
                )}
              </g>
            );
          })}

          {/* IP Nodes */}
          {ASNs.flatMap(asn =>
            asn.ips.map(ipData => {
              const pos    = IP_POS[ipData.ip];
              if (!pos) return null;
              const c      = ASN_COLOR[asn.id];
              const isHov  = hoverIP  === ipData.ip;
              const isAct  = activeIP === ipData.ip;
              const fade   = hoverIP && hoverIP !== ipData.ip && !connectedToHover.has(ipData.ip);

              return (
                <g key={ipData.ip}
                  style={{ cursor:"pointer", transition:"opacity 0.15s" }}
                  opacity={fade ? 0.18 : 1}
                  onClick={e => { e.stopPropagation(); setActiveIP(ipData.ip); }}
                  onMouseEnter={() => setHoverIP(ipData.ip)}
                  onMouseLeave={() => setHoverIP(null)}
                >
                  {(isHov || isAct) && (
                    <circle cx={pos.x} cy={pos.y} r={NODE_R + 8}
                      fill="none" stroke={c} strokeWidth="1" opacity="0.3"/>
                  )}
                  <circle cx={pos.x} cy={pos.y} r={NODE_R}
                    fill={c + "16"}
                    stroke={c}
                    strokeWidth={isHov || isAct ? 2 : 1.5}
                  />
                  <text
                    x={pos.x} y={pos.y + 4}
                    textAnchor="middle"
                    fontSize="8.5"
                    fontFamily="'Courier New', monospace"
                    fill={c}
                    fontWeight="600"
                  >{ipData.ip}</text>
                  {ipData.date && (
                    <text x={pos.x} y={pos.y + NODE_R + 14}
                      textAnchor="middle" fontSize="8"
                      fontFamily="'Courier New', monospace" fill="#334155"
                    >{ipData.date}</text>
                  )}
                </g>
              );
            })
          )}
        </g>
      </svg>

      {/* Zoom controls */}
      <div style={{
        position:"fixed", bottom:20, right:20,
        display:"flex", flexDirection:"column", gap:4,
        zIndex:50,
      }}>
        {[
          { label:"+", action: () => setTransform(t => ({ ...t, scale: Math.min(t.scale * 1.2, 6) })) },
          { label:"⟳", action: () => setTransform({ x:(window.innerWidth-W)/2, y:(window.innerHeight-H)/2, scale:1 }) },
          { label:"−", action: () => setTransform(t => ({ ...t, scale: Math.max(t.scale * 0.83, 0.25) })) },
        ].map(btn => (
          <button key={btn.label} onClick={btn.action} style={{
            width:32, height:32,
            background:"#0d1724",
            border:"1px solid #1e3a5f",
            borderRadius:5,
            color:"#64748b",
            fontSize: btn.label === "⟳" ? 14 : 18,
            lineHeight:1,
            cursor:"pointer",
            display:"flex", alignItems:"center", justifyContent:"center",
            fontFamily:"monospace",
            transition:"border-color 0.15s, color 0.15s",
          }}
          onMouseEnter={e => { e.currentTarget.style.borderColor="#38bdf8"; e.currentTarget.style.color="#38bdf8"; }}
          onMouseLeave={e => { e.currentTarget.style.borderColor="#1e3a5f"; e.currentTarget.style.color="#64748b"; }}
          >{btn.label}</button>
        ))}
      </div>
      {/* Pan hint */}
      <div style={{
        position:"fixed", bottom:18, left:20,
        fontSize:10, color:"#1e3a5f", fontFamily:"monospace",
        letterSpacing:"0.06em", pointerEvents:"none",
      }}>drag / swipe to pan · pinch to zoom</div>

      <Tooltip ip={activeIP} onClose={() => setActiveIP(null)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
