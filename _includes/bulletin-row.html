<article class="bulletin-row" data-publication
  data-search-title="{{ include.post.title | strip_html | downcase | escape }}"
  data-search-description="{{ include.post.description | downcase | escape }}"
  data-search-tags="{{ include.post.tags | join: ' ' | downcase | escape }}"
  data-tags="{{ include.post.tags | jsonify | escape }}"
  data-search-url="{{ include.post.url | relative_url }}">
  <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%b %-d, %Y' }}</time>
  <div>
    <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title | escape }}</a></h3>
    {% include publication-tags.html post=include.post %}
  </div>
  <a class="bulletin-arrow" href="{{ include.post.url | relative_url }}" aria-label="Read {{ include.post.title | escape }}">↗</a>
</article>
